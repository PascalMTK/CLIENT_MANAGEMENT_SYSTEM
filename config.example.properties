# Copy this file to config.properties to change the database connection.
# Without a config.properties, the application uses the values below.
#
# Windows authentication, default port 1433:
db.url=jdbc:sqlserver://localhost:1433;databaseName=CLIENT_FILE_MANAGEMENT_SYSTEM;integratedSecurity=true;encrypt=true;trustServerCertificate=true;loginTimeout=5

# SQL Server authentication: remove integratedSecurity=true from db.url, then fill in:
db.user=
db.password=

# If the port differs, find it with:
#   sqlcmd -S .\SQLEXPRESS -E -Q "EXEC xp_readerrorlog 0,1,N'listening'"
# TCP/IP must be enabled in SQL Server Configuration Manager: the JDBC driver cannot use shared memory.
